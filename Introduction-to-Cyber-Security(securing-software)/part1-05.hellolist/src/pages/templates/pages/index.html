<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Hello List!</title>
    </head>

    <body>
        <form action="/" method="POST">
            { % csrf_token %}
            <h1>Hello List!</h1>

            <ul>
                <!-- enumerating the list items[] -->
                {% for item in items %}
                {{item}}
                {% endfor %}
            </ul>
        </form>
    </body>
</html>
